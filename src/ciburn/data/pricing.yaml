# ciburn pricing data. Every number here was read from a primary GitHub source
# on the date in `fetched_at`. Nothing in the code hardcodes a price; the
# pricing engine loads this file. `tests/test_pricing_freshness.py` fails when
# `fetched_at` is older than 90 days so stale prices cannot ship silently.
#
# Verification notes for each block are in RESEARCH.md.
schema_version: 1
fetched_at: "2026-09-11T18:40:00Z"
currency: USD

rounding:
  rule: per_job_round_up_to_whole_minute
  statement: "GitHub rounds the minutes and partial minutes each job uses up to the nearest whole minute."
  source_url: https://docs.github.com/en/billing/reference/actions-runner-pricing
  source_git: https://github.com/github/docs/blob/main/content/billing/reference/actions-runner-pricing.md
  fetched_at: "2026-09-11T18:40:00Z"
  verified: true

free_usage:
  # "GitHub Actions usage is free for self-hosted runners and for public
  # repositories that use standard GitHub-hosted runners."
  public_repositories_standard_runners: true
  self_hosted_runners: true
  larger_runners_public_repositories: false  # "Larger runners are always charged for, even when used by public repositories"
  source_url: https://docs.github.com/en/billing/concepts/product-billing/github-actions
  fetched_at: "2026-09-11T18:40:00Z"
  verified: true

included_minutes:
  # Minutes per month for standard GitHub-hosted runners in private repos.
  # "Included minutes cannot be used for larger runners."
  source_url: https://docs.github.com/en/billing/concepts/product-billing/github-actions
  fetched_at: "2026-09-11T18:40:00Z"
  verified: true
  plans:
    free: 2000
    pro: 3000
    free_org: 2000
    team: 3000
    enterprise: 50000
  # How non-Linux standard minutes draw down the included quota is NOT stated
  # on a current primary page (the legacy 2x/10x multiplier table was replaced
  # by per-SKU rates in 2025). ciburn therefore applies the quota only when the
  # user passes --plan, and draws it down at list-price ratio
  # (minutes * sku_rate / linux_2core_rate). That ratio is an ASSUMPTION and is
  # labelled as such in every report. See DECISIONS.md D005.
  drawdown_rule: list_price_ratio
  drawdown_rule_verified: false

limits:
  default_job_timeout_minutes: 360
  ubuntu_slim_job_timeout_minutes: 15
  max_matrix_jobs: 256
  source_url: https://docs.github.com/en/actions/reference/limits
  ubuntu_slim_source_url: https://github.blog/changelog/2026-01-22-1-vcpu-linux-runner-now-generally-available-in-github-actions/
  fetched_at: "2026-09-11T18:40:00Z"
  verified: true

# Label -> SKU mapping for GitHub-hosted runners. Patterns are Python regexes
# matched against each job label (case-insensitive). First match wins.
# Linux/Windows *larger* runners use org-defined custom labels and cannot be
# inferred from the label alone; they fall through to `unknown` and are
# reported as unpriced minutes unless the user supplies --label-sku.
label_patterns:
  source_url: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
  larger_runner_source_url: https://docs.github.com/en/actions/reference/runners/larger-runners
  fetched_at: "2026-09-11T18:40:00Z"
  rules:
    - pattern: '^ubuntu-slim$'
      sku: actions_linux_slim
    - pattern: '^ubuntu-(latest|\d\d\.\d\d)-arm$'
      sku: actions_linux_arm
    - pattern: '^ubuntu-(latest|\d\d\.\d\d)$'
      sku: actions_linux
    - pattern: '^windows-11-arm$'
      sku: actions_windows_arm
    - pattern: '^windows-(latest|\d{4})$'
      sku: actions_windows
    - pattern: '^macos-(latest|\d+)-large$'
      sku: macos_l
    - pattern: '^(macos-(latest|\d+)|xcode-\d+)-xlarge$'
      sku: macos_xl
    - pattern: '^macos-(latest|\d+)(-intel)?$'
      sku: actions_macos

