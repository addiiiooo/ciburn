[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ciburn"
version = "0.1.1"
description = "Find out what your GitHub Actions CI costs and where the money is wasted, from your own run history. Offline, no LLM, no service."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Sumanth", email = "adityasumanth@gmail.com" }]
keywords = ["github-actions", "ci", "cost", "billing", "static-analysis", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1,<9",
  "rich>=13.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
corpus = ["pandas>=2.2", "pyarrow>=16"]

[project.scripts]
ciburn = "ciburn.cli:main"

[project.urls]
Homepage = "https://github.com/addiiiooo/ciburn"
Repository = "https://github.com/addiiiooo/ciburn"
Issues = "https://github.com/addiiiooo/ciburn/issues"
Changelog = "https://github.com/addiiiooo/ciburn/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML",
  "pandas>=2.2",
  "pyarrow>=16",
  "pandas-stubs",
  "pyarrow-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ciburn"]

[tool.hatch.build.targets.sdist]
include = ["src/ciburn", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF", "PT", "T20", "ARG", "PL"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911", "PLR0917", "T201", "E501", "PLW2901", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR", "S101"]
"src/ciburn/join.py" = ["ARG001"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/ciburn", "tests"]
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["hypothesis", "hypothesis.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: makes real network calls to api.github.com (skipped unless CIBURN_LIVE=1)",
]
filterwarnings = ["error::DeprecationWarning:ciburn.*"]

[tool.coverage.run]
branch = true
source = ["ciburn"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
