name: test
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -x
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: python:3.12
    steps:
      - run: ruff check .
