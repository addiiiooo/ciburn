name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: everything
          path: dist/
          retention-days: 5
